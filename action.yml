name: "Build .NET"
author: "Arbeidstilsynet"
description: "Restores, checks formatting, lints, builds, and tests a .NET solution/project. Can optionally run SonarQube Cloud analysis."

inputs:
  working-directory:
    description: "The directory to run dotnet commands in"
    required: true
  dotnet-version:
    description: "The version of dotnet to use"
    default: "10.0.x"
  skip-csharpier:
    description: "Skip the CSharpier check"
    default: "false"
  skip-style-analyzers:
    description: "Skip dotnet format style and analyzers checks"
    default: "false"
  cache-nuget:
    description: "Cache the NuGet global packages folder, keyed on project, props and lock files in working-directory"
    default: "true"
  enable-sonar:
    description: "Enable SonarQube analysis"
    default: "false"
  sonar-token:
    description: "SonarQube token"
    required: false
  sonar-organization:
    description: "SonarQube organization"
    required: false
  sonar-project-key:
    description: "SonarQube project key"
    required: false
  sonar-exclusions:
    description: "Comma-separated list of file patterns to exclude from SonarQube analysis (e.g., '**/Migrations/**,**/Utils/**')"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Validate SonarQube inputs
      if: inputs.enable-sonar == 'true'
      run: |
        if [ -z "${{ inputs.sonar-token }}" ]; then
          echo "::error::sonar-token is required when enable-sonar is true"
          exit 1
        fi
        if [ -z "${{ inputs.sonar-organization }}" ]; then
          echo "::error::sonar-organization is required when enable-sonar is true"
          exit 1
        fi
        if [ -z "${{ inputs.sonar-project-key }}" ]; then
          echo "::error::sonar-project-key is required when enable-sonar is true"
          exit 1
        fi
      shell: bash

    - name: Set up JDK 17
      if: inputs.enable-sonar == 'true'
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        java-version: 17
        distribution: "zulu"

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Cache NuGet packages
      if: inputs.cache-nuget == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.nuget/packages
        # Tool manifests and central package files may live in working-directory or any ancestor, so match them workspace-wide.
        key: ${{ runner.os }}-nuget-${{ hashFiles(format('{0}/**/*.csproj', inputs.working-directory), format('{0}/**/*.props', inputs.working-directory), format('{0}/**/packages.lock.json', inputs.working-directory), '**/Directory.Packages.props', '**/Directory.Build.props', '**/.config/dotnet-tools.json') }}
        restore-keys: ${{ runner.os }}-nuget-

    - name: Cache SonarQube packages
      if: inputs.enable-sonar == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar

    - name: Cache SonarQube scanner
      if: inputs.enable-sonar == 'true'
      id: cache-sonar-scanner
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ runner.temp }}/scanner
        key: ${{ runner.os }}-sonar-scanner
        restore-keys: ${{ runner.os }}-sonar-scanner

    - name: Install SonarQube scanner
      if: inputs.enable-sonar == 'true' && steps.cache-sonar-scanner.outputs.cache-hit != 'true'
      run: |
        mkdir -p ${{ runner.temp }}/scanner
        dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}/scanner
      shell: bash

    - name: Restore tools
      if: inputs.skip-csharpier != 'true'
      run: dotnet tool restore
      working-directory: ${{ inputs.working-directory }}
      shell: bash

    - name: Restore
      run: dotnet restore
      working-directory: ${{ inputs.working-directory }}
      shell: bash

    - name: List packages
      run: dotnet list package
      working-directory: ${{ inputs.working-directory }}
      shell: bash

    - name: Csharpier lint
      if: inputs.skip-csharpier != 'true'
      run: dotnet csharpier check .
      working-directory: ${{ inputs.working-directory }}
      shell: bash

    # Each check loads and compiles the whole workspace, so running both
    # concurrently roughly halves the wall time. Restore already ran above.
    - name: Dotnet format style and analyzers
      if: inputs.skip-style-analyzers != 'true'
      run: |
        log_dir="$(mktemp -d)"
        dotnet format style --verify-no-changes --no-restore > "$log_dir/style.log" 2>&1 &
        style_pid=$!
        dotnet format analyzers --verify-no-changes --no-restore > "$log_dir/analyzers.log" 2>&1 &
        analyzers_pid=$!

        style_status=0
        wait "$style_pid" || style_status=$?
        analyzers_status=0
        wait "$analyzers_pid" || analyzers_status=$?

        report() {
          if [ "$2" -eq 0 ]; then
            echo "::group::dotnet format $1 (passed)"
            cat "$log_dir/$1.log"
            echo "::endgroup::"
          else
            cat "$log_dir/$1.log"
            echo "::error::dotnet format $1 --verify-no-changes failed (exit $2)"
          fi
        }
        report style "$style_status"
        report analyzers "$analyzers_status"

        [ "$style_status" -eq 0 ] && [ "$analyzers_status" -eq 0 ]
      working-directory: ${{ inputs.working-directory }}
      shell: bash

    - name: Begin SonarQube analysis
      if: inputs.enable-sonar == 'true'
      run: |
        SONAR_ARGS="/o:${{ inputs.sonar-organization }}"
        SONAR_ARGS="$SONAR_ARGS /k:${{ inputs.sonar-project-key }}"
        SONAR_ARGS="$SONAR_ARGS /d:sonar.token=${{ inputs.sonar-token }}"
        SONAR_ARGS="$SONAR_ARGS /d:sonar.cs.vscoveragexml.reportsPaths=**/coverage.xml"
        if [ -n "${{ inputs.sonar-exclusions }}" ]; then
          SONAR_ARGS="$SONAR_ARGS /d:sonar.exclusions=${{ inputs.sonar-exclusions }}"
        fi
        ${{ runner.temp }}/scanner/dotnet-sonarscanner begin $SONAR_ARGS
      working-directory: ${{ inputs.working-directory }}
      shell: bash

    - name: Build
      run: dotnet build --no-restore
      working-directory: ${{ inputs.working-directory }}
      shell: bash

    - name: Test
      run: dotnet test --no-build -- --coverage --coverage-output-format xml --coverage-output coverage.xml
      working-directory: ${{ inputs.working-directory }}
      shell: bash

    - name: End SonarQube analysis
      if: inputs.enable-sonar == 'true'
      run: |
        ${{ runner.temp }}/scanner/dotnet-sonarscanner end /d:sonar.token="${{ inputs.sonar-token }}"
      working-directory: ${{ inputs.working-directory }}
      shell: bash
